<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site Offline — Kashmiri Gold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0B14;
    --ink: #EDEFF7;
    --muted: #8B90A8;
    --violet: #7C5CFF;
    --blue: #3D8BFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card { max-width: 520px; }
  .mark {
    width: 56px;
    height: 64px;
    margin: 0 auto 32px;
    display: block;
  }
  .mark polygon {
    fill: none;
    stroke: url(#g);
    stroke-width: 3;
    stroke-linejoin: round;
  }
  h1 {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    font-size: 1rem;
    margin-bottom: 32px;
  }
  .cta {
    display: inline-block;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 8px;
    background: linear-gradient(100deg, var(--violet), var(--blue));
    transition: opacity 0.2s ease;
  }
  .cta:hover { opacity: 0.85; }
  .cta:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 3px;
  }
  .footnote {
    margin-top: 40px;
    margin-bottom: 0;
    font-size: 0.8rem;
    color: var(--muted);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 56 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7C5CFF"/>
          <stop offset="1" stop-color="#3D8BFF"/>
        </linearGradient>
      </defs>
      <polygon points="28,3 53,17 53,47 28,61 3,47 3,17"/>
    </svg>
    <h1>This site is temporarily offline</h1>
    <p>Access to kashmirigold.com has been paused. To restore the site, please get in touch via Ostfro.</p>
    <a class="cta" href="https://www.ostfro.com">Contact Ostfro</a>
    <p class="footnote">Site built and hosted by Ostfro · www.ostfro.com</p>
  </main>
</body>
</html>
